tasks.named("compileJava").configure {
	doFirst {
		configurations.compileClasspath.files.findAll {
			it.name.startsWith("Registrate-") && it.name.endsWith(".jar")
		}.each { registrateJar ->
			patchRegistrateRegistryEntry(registrateJar)
			remapResourceLocationClassReferences(registrateJar, false)
		}
	}
}

// jarJar packages its generated dependency jars before the regular jar task runs.
// Patch Registrate here as well so a clean/incremental build cannot embed the
// unmodified 1.21 library (which still references ResourceLocation on 26.2).
tasks.named("jarJar").configure {
	dependsOn(tasks.named("compileJava"))
	doFirst {
		fileTree(layout.buildDirectory.dir("generated/jarJar")).matching {
			include("**/Registrate-*.jar")
		}.files.each { registrateJar ->
			patchRegistrateRegistryEntry(registrateJar)
			remapResourceLocationClassReferences(registrateJar)
		}
	}
}

tasks.named("jar").configure {
    dependsOn(tasks.named("prepareEmbeddedFlywheel"))
    dependsOn(patchLocalCatnipJar)
    doFirst {
        fileTree(layout.buildDirectory.dir("generated/jarJar")).matching {
            include("**/Registrate-*.jar")
        }.files.each { registrateJar ->
            patchRegistrateRegistryEntry(registrateJar)
            remapResourceLocationClassReferences(registrateJar)
        }
    }
    doLast {
        remapResourceLocationClassReferences(archiveFile.get().asFile)
    }
}

