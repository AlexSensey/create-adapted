buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.ow2.asm:asm:9.10.1")
        classpath("org.ow2.asm:asm-commons:9.10.1")
    }
}

plugins {
    id("idea")
    id("eclipse")
    id("maven-publish")
    id("net.kyori.blossom") version "2.2.0" // https://github.com/KyoriPowered/blossom
    id("dev.ithundxr.silk") version "1.0.1" // https://github.com/ithundxr/silk
    id("net.neoforged.moddev") version "2.0.141" // https://projects.neoforged.net/neoforged/ModDevGradle
    id("me.modmuss50.mod-publish-plugin") version "1.1.0" // https://github.com/modmuss50/mod-publish-plugin
}

boolean dev = System.getenv("RELEASE") == null || System.getenv("RELEASE") == "false"
String buildNumber = System.getenv("BUILD_NUMBER")
String gitHash = calculateGitHash() + (hasUnstaged() ? "-modified" : "")

group = "com.simibubi.create"
version = mod_version + (dev && buildNumber != null ? "-${buildNumber}" : "")

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println("Java: ${System.getProperty("java.version")}, JVM: ${System.getProperty("java.vm.version")} (${System.getProperty("java.vendor")}), Arch: ${System.getProperty("os.arch")}")

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

neoForge {
    version = neo_version

    accessTransformers {
        publish(file("src/main/resources/META-INF/accesstransformer.cfg"))
    }

    if (parchment_version != "none") {
        parchment {
            minecraftVersion = parchment_minecraft_version == "same" ? minecraft_version : parchment_minecraft_version
            mappingsVersion = parchment_version
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            systemProperty("forge.logging.markers", "REGISTRIES")
            jvmArgument("-XX:+IgnoreUnrecognizedVMOptions")
            jvmArgument("-XX:+AllowEnhancedClassRedefinition")
            //jvmArgument("-XX:-OmitStackTraceInFastThrow") // uncomment when you get exceptions with null messages etc
            //jvmArgument("-XX:+UnlockCommercialFeatures") // uncomment for profiling

            systemProperty("mixin.debug.verbose", "true")
            systemProperty("mixin.debug.export", "true")

            systemProperty("neoforge.enabledGameTestNamespaces", mod_id as String)

            loggingConfigFile = project.file("log4j.xml")
        }

        client {
            client()
        }

        server {
            server()

            gameDirectory = project.file("run/server")

            programArgument("--nogui")
        }

        data {
            // Minecraft 26.2 split data generation into clientData and serverData.
            // Create's recipe/tag providers are server-side, while Registrate can still
            // emit the requested client resources when --all is present.
            type = "serverData"

            programArguments.addAll(
                "--mod", mod_id as String,
                "--all",
				// Until the real 26.2 providers are restored, keep the compatibility
				// run away from the checked-in generated resources: an empty provider
				// set would otherwise delete every existing file as stale.
                "--output", file("build/generated/runData/").getAbsolutePath(),
                "--existing", file("src/main/resources/").getAbsolutePath()
            )
        }

        gameTestServer {
            type = "gameTestServer"
        }
    }
}

repositories {
    maven { url = "https://maven.createmod.net" } // Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://maven.blamejared.com" } // JEI, Vazkii's Mods
    maven { url = "https://maven.theillusivec4.top/" } // Curios API
    maven { url = "https://maven.squiddev.cc" } // CC: Tweaked
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.ftb.dev/releases" } // FTB Mods
    maven { url = "https://maven.architectury.dev" } // Arch API
    // NeoForge config api port, needed by ponder
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
    maven {
        url = "https://jm.gserv.me/repository/maven-public" // JourneyMap
        content {
            includeGroup "info.journeymap"
            includeGroup "mysticdrew"
        }
    }
    maven { url "https://chocolateminecraft.com/maven" } // Xaero
}

configurations {
    localImplementation

    runtimeClasspath.extendsFrom(localImplementation)
    compileClasspath.extendsFrom(localImplementation)

    runtimeClasspath.extendsFrom(localRuntimeOnly)
}

dependencies {
    // Required dependencies
    jarJar(api("com.tterrag.registrate:Registrate:$registrate_version"))

    if (providers.gradleProperty("useRealFlywheel").orNull == "true") {
        compileOnlyApi(files(layout.buildDirectory.file("flywheel-runtime/flywheel-neoforge-26.2-${flywheel_version}.jar")))
    } else {
        compileOnlyApi("dev.engine-room.flywheel:flywheel-neoforge-api-$minecraft_dependency_version:$flywheel_version")
        jarJar(runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-$minecraft_dependency_version:$flywheel_version") {
            version {
                strictly "[${flywheel_version},2.0)"
                prefer flywheel_version
            }
        })
    }

    jarJar(api("net.createmod.ponder:ponder-neoforge:$ponder_version+mc$minecraft_dependency_version") {
        version {
            strictly "[$ponder_version+mc$minecraft_dependency_version,)"
            prefer "$ponder_version+mc$minecraft_dependency_version"
        }
    })

    // Local dependencies - not published to consumers
    if (providers.gradleProperty("useRealFlywheel").orNull != "true") {
        localRuntimeOnly("dev.engine-room.vanillin:vanillin-neoforge-$minecraft_dependency_version:$vanillin_version")
    }

    localImplementation("mezz.jei:jei-$minecraft_dependency_version-neoforge:$jei_version")

    compileOnly("top.theillusivec4.curios:curios-neoforge:$curios_version:api")

    compileOnly("maven.modrinth:sodium:mc$minecraft_dependency_version-$sodium_version-neoforge")

    if (cc_tweaked_enable.toBoolean()) {
        compileOnly("cc.tweaked:cc-tweaked-$minecraft_dependency_version-core-api:$cc_tweaked_version")
        compileOnly("cc.tweaked:cc-tweaked-$minecraft_dependency_version-forge-api:$cc_tweaked_version")
        if (cc_tweaked_runtime_enable.toBoolean()) {
            localRuntimeOnly("cc.tweaked:cc-tweaked-$minecraft_dependency_version-forge:$cc_tweaked_version")
        }
    }

    compileOnly("maven.modrinth:farmers-delight:${farmers_delight_version}")
    if (farmers_delight_enable.toBoolean()) {
        localImplementation("maven.modrinth:farmers-delight:${farmers_delight_version}")
    }

    compileOnly("dev.ftb.mods:ftb-chunks-neoforge:2101.1.1")
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:2101.1.0")
    compileOnly("dev.ftb.mods:ftb-library-neoforge:2101.1.3")

    compileOnly("maven.modrinth:journeymap:26.2-6.0.4+neoforge")
    compileOnly("info.journeymap:journeymap-api-neoforge:26.2-2.0.0-SNAPSHOT") {
        exclude(group: "curse.maven") // Pulls in a old version of journey map which is for forge
    }

    compileOnly("xaero.lib:xaerolib-neoforge-1.21:1.0.42")
    compileOnly("curse.maven:xaeros-world-map-317780:7401095")
}

sourceSets.main {
    java {
        // Temporary 26.2 port step: CC:Tweaked implementation API changed; keep the public hooks
        // compiling while core Create is ported first.
        exclude("com/simibubi/create/compat/computercraft/implementation/**")
        // Temporary 26.2 port step: JEI 30 changed category/rendering APIs. Keep only tiny core-facing
        // stubs until the optional JEI plugin is ported.
        exclude("com/simibubi/create/compat/jei/category/*.java")
        // Blueprint transfer support has been ported to JEI 30.
        exclude("com/simibubi/create/compat/jei/EmptyBackground.java")
        // Ghost ingredient support has been ported to JEI 30.
        exclude("com/simibubi/create/compat/jei/ItemIcon.java")
        // Potion fluid subtypes have been ported to JEI 30.
        exclude("com/simibubi/create/compat/jei/ScreenResourceWrapper.java")
        // Create screen spacing and Stock Keeper JEI GUI handlers have been ported to JEI 30.
        exclude("com/simibubi/create/compat/trainmap/FTBChunksTrainMap.java")
        exclude("com/simibubi/create/infrastructure/gametest/**")
		// The 26.2 server-data bridge restores registry entries, registry tags and
		// data maps. Client/wiki/lang providers remain isolated for later ports.
        exclude("com/simibubi/create/infrastructure/command/CameraAngleCommand.java")
        exclude("com/simibubi/create/infrastructure/command/CameraDistanceCommand.java")
        exclude("com/simibubi/create/infrastructure/command/ClearBufferCacheCommand.java")
        exclude("com/simibubi/create/infrastructure/command/CloneCommand.java")
        exclude("com/simibubi/create/infrastructure/command/ConfigureConfigCommand.java")
        exclude("com/simibubi/create/infrastructure/command/CreateTestCommand.java")
        exclude("com/simibubi/create/infrastructure/command/DebugHatsCommand.java")
        exclude("com/simibubi/create/infrastructure/command/DebugInfoCommand.java")
        exclude("com/simibubi/create/infrastructure/command/DebugValueCommand.java")
        exclude("com/simibubi/create/infrastructure/command/FixLightingCommand.java")
        exclude("com/simibubi/create/infrastructure/command/HighlightCommand.java")
        exclude("com/simibubi/create/infrastructure/command/HighlightPacket.java")
        exclude("com/simibubi/create/infrastructure/command/KillTPSCommand.java")
        exclude("com/simibubi/create/infrastructure/command/ReplaceInCommandBlocksCommand.java")
        exclude("com/simibubi/create/infrastructure/command/ToggleDebugCommand.java")
        // Temporary 26.2 port step: datagen provider APIs changed significantly. Keep shared tag
        // constants like CommonMetal/Mods compiling, but skip generator implementations for now.
        exclude("com/simibubi/create/infrastructure/data/CreateDatagen.java")
        exclude("com/simibubi/create/infrastructure/data/CreateWikiBlockInfoProvider.java")
		// Standard crafting, mechanical crafting and sequenced assembly still need
		// their dedicated 26.2 runners. Processing recipe generators are active.
        exclude("com/simibubi/create/foundation/mixin/BuiltInRegistriesMixin.java")
        exclude("com/simibubi/create/foundation/mixin/CustomItemUseEffectsMixin.java")
        exclude("**/package-info.java")
    }

    resources {
        srcDir("src/generated/resources")
        exclude(".cache/")
        exclude("data/create/.wiki")
    }

    blossom.javaSources {
        property("version", mod_version)
        property("gitCommit", gitHash.toString())
    }
}

// Compile-only migration probe for the real Flywheel sources. Keeping this in a
// separate source set lets us port the 1.21.1 renderer to 26.2 without replacing
// the stable runtime stubs until the backend can actually build and start.
sourceSets.create("flywheelProbe") {
    java {
        srcDirs(
                "Flywheel/common/src/api/java",
                "Flywheel/common/src/lib/java",
                "Flywheel/common/src/backend/java",
                "Flywheel/common/src/main/java",
                "Flywheel/neoforge/src/api/java",
                "Flywheel/neoforge/src/lib/java",
                "Flywheel/neoforge/src/backend/java",
                "Flywheel/neoforge/src/main/java"
        )
        exclude("**/package-info.java")
        exclude("**/impl/compat/EmbeddiumCompat.java")
        exclude("**/backend/mixin/GlStateManagerMixin.java")
        exclude("**/impl/mixin/LevelRendererMixin.java")
        exclude("**/impl/mixin/fix/FixFabulousDepthMixin.java")
        exclude("**/impl/mixin/neoforge/ModelBlockRendererMixin.java")
    }

    resources {
        srcDirs(
                "Flywheel/common/src/lib/resources",
                "Flywheel/common/src/backend/resources",
                "Flywheel/common/src/main/resources",
                "Flywheel/neoforge/src/main/resources"
        )
    }
}

configurations.flywheelProbeCompileClasspath.extendsFrom(configurations.compileClasspath)
configurations.flywheelProbeAnnotationProcessor.extendsFrom(configurations.annotationProcessor)

tasks.named("processFlywheelProbeResources", ProcessResources).configure {
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
                mod_license: "MIT",
                mod_issues: "https://github.com/Engine-Room/Flywheel/issues",
                mod_homepage: "https://github.com/Engine-Room/Flywheel",
                flywheel_id: "flywheel",
                flywheel_name: "Flywheel",
                flywheel_version: flywheel_version,
                flywheel_description: "An overhauled entity and block entity rendering API.",
                minecraft_maven_version_range: "[26.2,26.3)",
                neoforge_version_range: "[26.2.0.0,)"
        )
    }
}

tasks.register("flywheelRuntimeJar", Jar) {
    group = "build"
    description = "Builds the isolated Flywheel 26.2 runtime port for Prism testing."
    archiveBaseName = "flywheel-neoforge-26.2"
    archiveVersion = flywheel_version
    destinationDirectory = layout.buildDirectory.dir("flywheel-runtime")
    from(sourceSets.flywheelProbe.output)
    from("Flywheel/LICENSE.md") {
        rename { "LICENSE_FLYWHEEL.md" }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// The adapted Flywheel and Catnip builds are MIT licensed, so the public
// edition embeds them as standard NeoForge Jar-in-Jar dependencies. Ponder and
// Registrate are already supplied by the normal jarJar configuration.
tasks.register("prepareEmbeddedFlywheel") {
    dependsOn(tasks.named("jarJar"), tasks.named("flywheelRuntimeJar"))

    doLast {
        def jarJarDir = layout.buildDirectory.dir("generated/jarJar/META-INF/jarjar").get().asFile
        def flywheelJar = tasks.named("flywheelRuntimeJar", Jar).get().archiveFile.get().asFile
        def embeddedName = flywheelJar.name
        copy {
            from(flywheelJar)
            into(jarJarDir)
        }

        def metadataFile = new File(jarJarDir, "metadata.json")
        def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
        metadata.jars.removeAll {
            it.identifier?.group == "dev.engine-room.flywheel" && it.identifier?.artifact == "flywheel-neoforge-26.2"
        }
        metadata.jars.add([
                identifier: [
                        group   : "dev.engine-room.flywheel",
                        artifact: "flywheel-neoforge-26.2"
                ],
                version   : [
                        range          : flywheel_version_range,
                        artifactVersion: flywheel_version
                ],
                path      : "META-INF/jarjar/${embeddedName}".toString(),
                isObfuscated: false
        ])

		def catnipJar = fileTree("Ponder/catnip/neoforge/build/libs").matching {
			include("catnip-neoforge-*.jar")
		}.singleFile
		copy {
			from(catnipJar)
			into(jarJarDir)
		}
		def catnipVersion = catnipJar.name
			.substring("catnip-neoforge-".length(), catnipJar.name.length() - ".jar".length())
		metadata.jars.removeAll {
			it.identifier?.group == "net.createmod.catnip" && it.identifier?.artifact == "catnip-neoforge-26.2"
		}
		metadata.jars.add([
				identifier: [
						group   : "net.createmod.catnip",
						artifact: "catnip-neoforge-26.2"
				],
				version   : [
						range          : "[${catnipVersion}]".toString(),
						artifactVersion: catnipVersion
				],
				path      : "META-INF/jarjar/${catnipJar.name}".toString(),
				isObfuscated: false
		])
        metadataFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + "\n"
    }
}

if (providers.gradleProperty("useRealFlywheel").orNull == "true") {
    tasks.named("compileJava").configure {
        dependsOn(tasks.named("flywheelRuntimeJar"))
    }
}

var generateItemModelDefinitions = tasks.register("generateItemModelDefinitions") {
    def outputDir = layout.buildDirectory.dir("generated/createItemModelDefinitions")
    def itemModels = files(
            fileTree("src/main/resources/assets/create/models/item") {
                include("*.json")
            },
            fileTree("src/generated/resources/assets/create/models/item") {
                include("*.json")
            })

    inputs.files(itemModels)
    outputs.dir(outputDir)

    doLast {
        def targetDir = outputDir.get().asFile.toPath().resolve("assets/create/items").toFile()
        def generatedModelDir = outputDir.get().asFile.toPath().resolve("assets/create/models/item").toFile()
        delete(targetDir)
        delete(generatedModelDir)
        targetDir.mkdirs()
        generatedModelDir.mkdirs()

        def flatItemTextures = [
                schematic          : "create:item/schematic",
                empty_schematic    : "create:item/empty_schematic",
                schematic_and_quill: "create:item/schematic_and_quill"
        ]

        itemModels.files.findAll { it.name.endsWith(".json") }.each { modelFile ->
            def itemName = modelFile.name.substring(0, modelFile.name.length() - ".json".length())
            def modelLocation = flatItemTextures.containsKey(itemName)
                    ? "create:item/${itemName}_flat".toString()
                    : "create:item/${itemName}".toString()
            def modelDefinition = [
                    model: [
                            type : "minecraft:model",
                            model: modelLocation
                    ]
            ]

            def sourceModel = new groovy.json.JsonSlurper().parse(modelFile)
            def trimMaterials = [
                    "0.1": "minecraft:quartz",
                    "0.2": "minecraft:iron",
                    "0.3": "minecraft:netherite",
                    "0.4": "minecraft:redstone",
                    "0.5": "minecraft:copper",
                    "0.6": "minecraft:gold",
                    "0.7": "minecraft:emerald",
                    "0.8": "minecraft:diamond",
                    "0.9": "minecraft:lapis",
                    "1.0": "minecraft:amethyst"
            ]
            def trimOverrides = sourceModel.overrides?.findAll {
                it.predicate?.get("minecraft:trim_type") != null
            }
            if (trimOverrides) {
                def cases = trimOverrides.collect {
                    def predicate = it.predicate.get("minecraft:trim_type").toString()
                    [
                            when: trimMaterials[predicate],
                            model: [type: "minecraft:model", model: it.model]
                    ]
                }.findAll { it.when != null }
                def resinModel = "create:item/${itemName}_resin_trim".toString()
                cases.add([when: "minecraft:resin", model: [type: "minecraft:model", model: resinModel]])
                modelDefinition = [
                        model: [
                                type: "minecraft:select",
                                property: "minecraft:trim_material",
                                cases: cases,
                                fallback: [type: "minecraft:model", model: modelLocation]
                        ]
                ]
            }
            new File(targetDir, modelFile.name).text =
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(modelDefinition)) + "\n"

            if (flatItemTextures.containsKey(itemName)) {
                def flatModel = [
                        parent  : "minecraft:item/generated",
                        textures: [
                                layer0: flatItemTextures[itemName]
                        ]
                ]
                new File(generatedModelDir, "${itemName}_flat.json").text =
                        groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(flatModel)) + "\n"
            }
        }
    }
}

sourceSets.main.resources.srcDir(generateItemModelDefinitions)

jar {
	// This is the isolated public-distribution project. Upstream Create client
	// assets are supplied by the player at runtime. Keep only the small JSON
	// compatibility layer authored/generated for Minecraft 26.2.
	eachFile { details ->
		def path = details.path.replace('\\', '/')
		if (!path.startsWith("assets/"))
			return

		def isItemDefinition = path.startsWith("assets/create/items/") && path.endsWith(".json")
		def isEquipmentDefinition = path.startsWith("assets/create/equipment/") && path.endsWith(".json")
		def isGeneratedFlatModel = path == "assets/create/models/item/schematic_flat.json"
			|| path == "assets/create/models/item/empty_schematic_flat.json"
			|| path == "assets/create/models/item/schematic_and_quill_flat.json"
		def isAtlasCompatibility = path == "assets/minecraft/atlases/blocks.json"
			|| path == "assets/minecraft/atlases/particles.json"
			|| path == "assets/minecraft/atlases/armor_trims.json"
		if (!isItemDefinition && !isEquipmentDefinition && !isGeneratedFlatModel && !isAtlasCompatibility)
			details.exclude()
	}
    exclude("net/minecraft/**")
    exclude("net/createmod/**")
    exclude("net/neoforged/fml/**")
    exclude("net/neoforged/neoforge/common/**")
    exclude("net/neoforged/neoforge/registries/**")
    exclude("net/neoforged/neoforge/client/event/**")
    exclude("net/neoforged/neoforge/client/ChunkRenderTypeSet*.class")
    exclude("net/neoforged/neoforge/client/model/BakedModelWrapper*.class")
    exclude("net/neoforged/neoforge/client/model/QuadTransformers*.class")
    exclude("com/mojang/**")
    from("LICENSE.md") {
        rename { "${mod_name}_${it}" }
    }
	from("EXTERNAL_ASSETS.md")
}

def remapResourceLocationClassReferences = { File jarFile, boolean includeResourceLocations = true ->
    if (!jarFile.exists())
        return

    File tmpJar = new File(jarFile.parentFile, jarFile.name + ".rl-remap.tmp")
    boolean remapped = false
    def mappings = [
            "net/minecraft/data/tags/TagsProvider\$TagAppender": "net/minecraft/data/tags/TagAppender"
    ]
    if (includeResourceLocations) {
        mappings.put("net/minecraft/resources/ResourceLocation", "net/minecraft/resources/Identifier")
        mappings.put("net/minecraft/world/ItemInteractionResult",
                "com/simibubi/create/foundation/utility/LegacyItemInteractionResult")
    }
    def remapper = new org.objectweb.asm.commons.SimpleRemapper(mappings)

    new java.util.zip.ZipInputStream(new FileInputStream(jarFile)).withCloseable { input ->
        new java.util.zip.ZipOutputStream(new FileOutputStream(tmpJar)).withCloseable { output ->
            java.util.zip.ZipEntry entry
            while ((entry = input.nextEntry) != null) {
                output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                def entryBytes = new ByteArrayOutputStream()
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) != -1)
                    entryBytes.write(buffer, 0, read)
                byte[] bytes = entryBytes.toByteArray()

                if (entry.name.endsWith(".class")
                        && !entry.name.startsWith("net/minecraft/")
                        && !entry.name.startsWith("net/neoforged/neoforge/client/model/generators/")
                        && !entry.name.startsWith("com/mojang/")) {
                    def reader = new org.objectweb.asm.ClassReader(bytes)
                    def writer = new org.objectweb.asm.ClassWriter(reader, 0)
                    def visitor = new org.objectweb.asm.commons.ClassRemapper(writer, remapper)
                    reader.accept(visitor, 0)
                    bytes = writer.toByteArray()
                    remapped = true
                }

                output.write(bytes)
                output.closeEntry()
            }
        }
    }

    if (remapped) {
        if (!jarFile.delete())
            throw new GradleException("Could not replace ${jarFile}")
        if (!tmpJar.renameTo(jarFile))
            throw new GradleException("Could not move remapped jar to ${jarFile}")
    } else {
        tmpJar.delete()
    }
}

def patchRegistrateRegistryEntry = { File registrateJar ->
    if (!registrateJar.exists())
        return

    File tmpJar = new File(registrateJar.parentFile, registrateJar.name + ".tmp")
    boolean patched = false

    new java.util.zip.ZipInputStream(new FileInputStream(registrateJar)).withCloseable { input ->
        new java.util.zip.ZipOutputStream(new FileOutputStream(tmpJar)).withCloseable { output ->
            java.util.zip.ZipEntry entry
            while ((entry = input.nextEntry) != null) {
                output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                def entryBytes = new ByteArrayOutputStream()
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) != -1)
                    entryBytes.write(buffer, 0, read)
                byte[] bytes = entryBytes.toByteArray()

                if (entry.name.endsWith(".class")) {
                    def reader = new org.objectweb.asm.ClassReader(bytes)
                    def writer = new org.objectweb.asm.ClassWriter(reader, org.objectweb.asm.ClassWriter.COMPUTE_MAXS)
                    def visitor = new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9, writer) {
                        @Override
                        org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String descriptor,
                                                                    String signature, String[] exceptions) {
                            if (entry.name == "com/tterrag/registrate/providers/ProviderType.class"
                                    && name == "<clinit>") {
                                patched = true
                                def methodVisitor = super.visitMethod(access, name, descriptor, signature, exceptions)
                                methodVisitor.visitCode()
                                def emitNoopProviderType = { String fieldName, String providerName ->
