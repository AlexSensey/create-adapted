                byte[] bytes = entryBytes.toByteArray()

                if (entry.name == "net/neoforged/neoforge/registries/RegisterEvent\$RegisterHelper.class") {
                    boolean hasBridge = false
                    def reader = new org.objectweb.asm.ClassReader(bytes)
                    def writer = new org.objectweb.asm.ClassWriter(reader, 0)
                    def visitor = new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9, writer) {
                        @Override
                        org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String descriptor,
                                                                    String signature, String[] exceptions) {
                            if (name == "register"
                                    && descriptor == "(Lnet/minecraft/resources/ResourceLocation;Ljava/lang/Object;)V")
                                hasBridge = true
                            return super.visitMethod(access, name, descriptor, signature, exceptions)
                        }

                        @Override
                        void visitEnd() {
                            if (!hasBridge) {
                                patched = true
                                def mv = super.visitMethod(org.objectweb.asm.Opcodes.ACC_PUBLIC,
                                        "register",
                                        "(Lnet/minecraft/resources/ResourceLocation;Ljava/lang/Object;)V",
                                        null,
                                        null)
                                mv.visitCode()
                                mv.visitVarInsn(org.objectweb.asm.Opcodes.ALOAD, 0)
                                mv.visitVarInsn(org.objectweb.asm.Opcodes.ALOAD, 1)
                                mv.visitMethodInsn(org.objectweb.asm.Opcodes.INVOKEVIRTUAL,
                                        "net/minecraft/resources/ResourceLocation",
                                        "asIdentifier",
                                        "()Lnet/minecraft/resources/Identifier;",
                                        false)
                                mv.visitVarInsn(org.objectweb.asm.Opcodes.ALOAD, 2)
                                mv.visitMethodInsn(org.objectweb.asm.Opcodes.INVOKEINTERFACE,
                                        "net/neoforged/neoforge/registries/RegisterEvent\$RegisterHelper",
                                        "register",
                                        "(Lnet/minecraft/resources/Identifier;Ljava/lang/Object;)V",
                                        true)
                                mv.visitInsn(org.objectweb.asm.Opcodes.RETURN)
                                mv.visitMaxs(3, 3)
                                mv.visitEnd()
                            }
                            super.visitEnd()
                        }
                    }
                    reader.accept(visitor, 0)
                    bytes = writer.toByteArray()
                }

                output.write(bytes)
                output.closeEntry()
            }
        }
    }

    if (patched) {
        if (!neoForgeJar.delete())
            throw new GradleException("Could not replace ${neoForgeJar}")
        if (!tmpJar.renameTo(neoForgeJar))
            throw new GradleException("Could not move patched NeoForge jar to ${neoForgeJar}")
    } else {
        tmpJar.delete()
    }
}

