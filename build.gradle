        new java.util.zip.ZipOutputStream(new FileOutputStream(tmpJar)).withCloseable { output ->
            java.util.zip.ZipEntry entry
            while ((entry = input.nextEntry) != null) {
                output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                def entryBytes = new ByteArrayOutputStream()
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) != -1)
