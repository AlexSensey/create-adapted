mod_author = AlexSensey (adaptation); The Creators of Create (original)
mod_description = Unofficial Create adaptation for Minecraft 26.2, tested with NeoForge 26.2.0.18-beta. Original Create assets are not redistributed; the official Create 6.0.10 jar must be placed in the create_original folder.
